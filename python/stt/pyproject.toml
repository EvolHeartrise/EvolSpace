[project]
name = "evol-stt"
version = "0.1.0"
description = "EvolSpace speech-to-text HTTP service (faster-whisper) on 127.0.0.1:8790"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.1",
  "aiohttp>=3.10",
  "numpy>=1.26",
  # CUDA 12 runtime DLLs for CTranslate2 (cuBLAS + cuDNN 9). Harmless on CPU-only
  # machines; on Windows evol_stt.cuda adds their bin/ folders to the DLL path.
  "nvidia-cublas-cu12; sys_platform == 'win32' or sys_platform == 'linux'",
  "nvidia-cudnn-cu12>=9,<10; sys_platform == 'win32' or sys_platform == 'linux'",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
evol-stt = "evol_stt.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evol_stt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quick by default; real-model tests: pytest -m slow -s
addopts = "-m \"not slow\""
markers = ["slow: loads a real Whisper model (minutes on first run: downloads weights)"]
