[project]
name = "evolspace"
version = "0.1.0"
description = "Python SDK for EvolSpace: data channels (JSON + binary tensors), scene ops, agent I/O over the server's HTTP/WS API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "websockets>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolspace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["server: starts the real EvolSpace server (needs node + repo node_modules)"]
