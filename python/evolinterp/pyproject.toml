[project]
name = "evolinterp"
version = "0.1.0"
description = "Mechanistic-interpretability backend for EvolSpace: activation capture, logit lens, probes and SAEs for BeatSaberRL and a toy transformer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "evolspace",
  "numpy>=1.26",
  "torch>=2.4",
  "scikit-learn>=1.5",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
evolinterp = "evolinterp.cli:main"

[tool.uv.sources]
evolspace = { path = "../evolspace", editable = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evolinterp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "bsrl: needs the BeatSaberRL code export (data/bsrl) and a local checkpoint",
  "server: starts the real EvolSpace server (needs node + repo node_modules)",
]
